name: Deploy

# Dispara sozinho em push na main, e sob demanda pelo botao "Run workflow"
# (ou pela API — e assim que o Claude consegue subir e acompanhar o log).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Dois deploys ao mesmo tempo brigariam pelo mesmo diretorio na VPS.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  verificar:
    name: Build e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Roda antes de encostar na VPS: se o build quebra aqui, nao faz sentido
      # derrubar o servico la para descobrir isso.
      - name: Backend — dependencias
        run: npm --prefix backend ci

      - name: Backend — sintaxe
        run: node --check backend/server.js

      - name: Frontend — dependencias
        run: npm --prefix frontend ci

      - name: Frontend — lint
        run: npm --prefix frontend run lint

      - name: Frontend — build
        run: npm --prefix frontend run build

  publicar:
    name: Publicar na VPS
    needs: verificar
    runs-on: ubuntu-latest
    # 'producao' e um Environment do GitHub: e nele que fica o segredo, e e
    # onde da para exigir aprovacao manual antes de cada deploy.
    environment: producao
    steps:
      - name: Conectar e rodar o deploy
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # known_hosts fixo: sem isso um DNS sequestrado entregaria a chave de
          # deploy para outra maquina sem o menor aviso.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Nao passamos comando nenhum: a chave tem forced command no
          # authorized_keys da VPS e so consegue rodar o script de deploy.
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST"

      - name: Conferir que o site respondeu
        run: |
          set -euo pipefail
          echo "— health do backend —"
          curl -fsS --max-time 10 https://api.convorax.space/health; echo

          echo "— /token sem login tem que dar 401 —"
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            'https://api.convorax.space/token?room=x')
          echo "HTTP $codigo"
          [ "$codigo" = "401" ] || { echo "ERRO: esperado 401"; exit 1; }

          echo "— o site carrega —"
          curl -fsS --max-time 10 -o /dev/null -w 'HTTP %{http_code}\n' https://convorax.space
